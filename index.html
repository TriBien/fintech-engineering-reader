<style>
:root{
  --bg:#f4f6f8;--surface:#fff;--text:#17212b;--muted:#5f6b76;--border:#d9e0e7;
  --primary:#0b6efd;--primary-2:#084298;--chip:#eef3f8;--chip-on:#0b6efd;--chip-on-bg:#e7f1ff;
  --ok:#198754;--ok-bg:#e8f6ee;--shadow:0 1px 2px rgba(0,0,0,.06);
}
@media(prefers-color-scheme:dark){
:root{--bg:#0f141a;--surface:#171d24;--text:#e8edf2;--muted:#9aa7b4;--border:#2a3440;--chip:#222b35;--chip-on:#6ea8fe;--chip-on-bg:#13233a;--ok:#4dd38a;--ok-bg:#11261b;--shadow:none;}
}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.4}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.wrap{max-width:900px;margin:0 auto;padding:12px 14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;flex:0 0 auto;border-radius:10px;box-shadow:var(--shadow)}
h1{font-size:1.1rem;margin:0 0 2px} .sub{color:var(--muted);font-size:.85rem;margin:0}
.controls{display:grid;gap:8px;margin-top:10px}
input[type=search],select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-size:16px}
.tabs{display:flex;gap:6px} .tab{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:999px;background:var(--chip);color:var(--text);font-size:.9rem}
.tab.active{background:var(--chip-on-bg);color:var(--chip-on);border-color:var(--chip-on);font-weight:600}
main .wrap{padding-top:10px;padding-bottom:24px}
.stats{color:var(--muted);font-size:.85rem;margin:4px 2px 10px}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.card.read{opacity:.78}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.badge{font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted);max-width:100%}
.badge.cat{background:var(--chip-on-bg);color:var(--chip-on)}
.badge.read{background:var(--ok-bg);color:var(--ok);display:none}
.card.read .badge.read{display:inline-block}
.title{font-size:1rem;margin:0 0 4px}
.title a{color:var(--text);text-decoration:none}
.title a:hover{color:var(--primary);text-decoration:underline}
.src{font-size:.82rem;color:var(--muted);margin:0 0 10px;word-break:break-all}
.row{display:flex;gap:8px;align-items:center}
button.toggle{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.9rem}
button.toggle.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
@media(min-width:700px){.controls{grid-template-columns:1fr 220px}.tabs{grid-column:1/-1} h1{font-size:1.25rem}}
</style>
</head>
<body>
<header>
  <div class="wrap">

      </div>
    </div>
    <div class="controls">
      <input id="q" type="search" placeholder="Search title, source, or URL…" autocomplete="off">
      <select id="cat"><option value="">All categories</option></select>
      <div class="tabs" role="tablist" aria-label="Read filter">
        <button class="tab active" data-filter="all" type="button">All</button>
        <button class="tab" data-filter="unread" type="button">Unread</button>
        <button class="tab" data-filter="read" type="button">Read</button>
      </div>
    </div>
  </div>
</header>
<main><div class="wrap">
  <div id="stats" class="stats"></div>
  <div id="list" class="list"></div>
  <div id="empty" class="empty" hidden>No posts match.</div>
</div></main>

const STORAGE_KEY = 'fintech_reader_read_v1';
let readSet = new Set();
try { readSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); } catch(e){ readSet = new Set(); }
const state = { q:'', cat:'', filter:'all' };
const $ = s => document.querySelector(s);
const listEl = $('#list'), statsEl = $('#stats'), emptyEl = $('#empty');

function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify([...readSet])); }catch(e){} }
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return u; } }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

function initCats(){
  const sel = $('#cat');
  const cats = [...new Set(POSTS.map(p=>p.category))].sort((a,b)=>a.localeCompare(b));
  for(const c of cats){ const o=document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o); }
}

function filtered(){
  const q = state.q.trim().toLowerCase();
  return POSTS.filter(p=>{
    const isRead = readSet.has(p.url);
    if(state.filter==='read' && !isRead) return false;
    if(state.filter==='unread' && isRead) return false;
    if(state.cat && p.category!==state.cat) return false;
    if(q){
      const hay = (p.title+' '+p.source+' '+p.url+' '+p.category).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function render(){
  const items = filtered();
  const totalRead = POSTS.filter(p=>readSet.has(p.url)).length;
  statsEl.textContent = `Showing ${items.length} of ${POSTS.length} · ${totalRead} read · ${POSTS.length-totalRead} unread`;
  listEl.innerHTML = '';
  emptyEl.hidden = items.length !== 0;
  const frag = document.createDocumentFragment();
  for(const p of items){
    const isRead = readSet.has(p.url);
    const card = document.createElement('article');
    card.className = 'card' + (isRead ? ' read' : '');
    card.innerHTML = `
      <div class="meta">
        <span class="badge read">Read</span>
        <span class="badge cat">${esc(p.category)}</span>
      </div>
      <h2 class="title"><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.title || host(p.url))}</a></h2>
      <p class="src">${esc(p.source ? p.source + ' · ' : '')}${esc(host(p.url))}</p>
      <div class="row">
        <button class="toggle ${isRead?'':'primary'}" data-url="${esc(p.url)}" type="button">${isRead ? 'Mark unread' : 'Mark read'}</button>
      </div>`;
    frag.appendChild(card);
  }
  listEl.appendChild(frag);
}

listEl.addEventListener('click', e=>{
  const btn = e.target.closest('button.toggle');
  if(!btn) return;
  const url = btn.getAttribute('data-url');
  if(readSet.has(url)) readSet.delete(url); else readSet.add(url);
  save(); render();
});

$('#q').addEventListener('input', e=>{ state.q = e.target.value; render(); });
$('#cat').addEventListener('change', e=>{ state.cat = e.target.value; render(); });
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); state.filter = t.dataset.filter; render();
}));

initCats(); render();
</script>
